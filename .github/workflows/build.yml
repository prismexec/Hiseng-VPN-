name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: openflux/mobile/go.mod
          cache-dependency-path: openflux/mobile/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build OpenFlux library (gomobile)
        working-directory: openflux/mobile
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind@latest
          gomobile init
          gomobile bind -v -target=android/arm64,android/arm -androidapi 26 \
            -ldflags="-s -w -checklinkname=0" -o ../../app/libs/openflux.aar .
          ls -la ../../app/libs

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk QuasarVPN-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuasarVPN-apk
          path: QuasarVPN-*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quasar VPN ${{ github.run_number }}
          files: QuasarVPN-*.apk
