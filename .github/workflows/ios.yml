name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', 'openflux/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: openflux/mobile/go.mod
          cache-dependency-path: openflux/mobile/go.sum

      - name: Build OpenFlux core (liboflux.a)
        run: |
          export XCODE_PATH="$(dirname "$(dirname "$(xcode-select -p)")")"
          cd openflux
          bash build_ios.sh
          cp output/ios/liboflux.a output/ios/liboflux.h ../ios/Lib/
          ls -la ../ios/Lib

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          cd ios
          xcodebuild -project HisengVPN.xcodeproj -scheme HisengVPN \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.2.${{ github.run_number }} \
            build > build.log 2>&1 || { grep -E -A3 "\.(swift|h|m):[0-9]+:[0-9]+: error|ld: |Undefined symbols" build.log | cut -c1-400 | head -120; tail -8 build.log | cut -c1-300; exit 1; }
          grep -E "\.swift:[0-9]+:[0-9]+: warning" build.log | sort -u | head -40 || true
          tail -5 build.log
          test -d build/Build/Products/Release-iphoneos/HisengVPN.app

      - name: Package IPA (ad-hoc signed with VPN entitlement)
        run: |
          cd ios
          APP=build/Build/Products/Release-iphoneos/HisengVPN.app
          codesign --force --sign - --entitlements entitlements.plist "$APP/PlugIns/HisengTunnel.appex"
          codesign --force --sign - --entitlements entitlements.plist "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ../HisengVPN-ios-${{ github.run_number }}.ipa Payload
          ls -la ../*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HisengVPN-ipa
          path: HisengVPN-ios-*.ipa

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Hiseng VPN iOS ${{ github.run_number }}
          files: HisengVPN-ios-*.ipa

      - name: Update install source (altstore.json)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 .github/scripts/altstore.py "${{ github.run_number }}" "1.2.${{ github.run_number }}" \
            "HisengVPN-ios-${{ github.run_number }}.ipa" > altstore.json
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          git commit -m "Install source: iOS build ${{ github.run_number }}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
