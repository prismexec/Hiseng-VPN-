name: HisengVPN
options:
  bundleIdPrefix: com.hiseng
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HisengVPN:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: HisengTunnel
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hiseng VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hiseng.vpn.link
            CFBundleURLSchemes: [openflux]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiseng.vpn
        PRODUCT_NAME: HisengVPN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HisengTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    dependencies:
      - framework: Lib/liboflux.a
        embed: false
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Hiseng Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiseng.vpn.tunnel
        PRODUCT_NAME: HisengTunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Lib"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/Lib"]
        OTHER_LDFLAGS: ["-lresolv", "-framework", "CoreFoundation", "-framework", "Security"]
